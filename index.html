<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Animated Weather App</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#00c6ff,#0072ff);
    overflow:hidden;
    transition:1s;
}

.container{
    width:380px;
    background:rgba(255,255,255,0.15);
    backdrop-filter:blur(15px);
    border-radius:30px;
    padding:25px;
    box-shadow:0 10px 40px rgba(0,0,0,0.3);
    animation:float 3s ease-in-out infinite;
}

@keyframes float{
    0%{
        transform:translateY(0px);
    }
    50%{
        transform:translateY(-10px);
    }
    100%{
        transform:translateY(0px);
    }
}

.search-box{
    display:flex;
    gap:10px;
}

.search-box input{
    flex:1;
    padding:15px;
    border:none;
    outline:none;
    border-radius:15px;
    font-size:16px;
}

.search-box button{
    width:60px;
    border:none;
    border-radius:15px;
    background:#0072ff;
    color:white;
    font-size:22px;
    cursor:pointer;
    transition:0.4s;
}

.search-box button:hover{
    transform:scale(1.1);
    background:#005ce6;
}

.weather{
    text-align:center;
    margin-top:25px;
    color:white;
}

.weather img{
    width:140px;
    animation:rotate 5s linear infinite;
}

@keyframes rotate{
    from{
        transform:rotate(0deg);
    }
    to{
        transform:rotate(360deg);
    }
}

.temp{
    font-size:70px;
    font-weight:700;
}

.city{
    font-size:35px;
    margin-top:5px;
}

.details{
    display:flex;
    justify-content:space-between;
    margin-top:30px;
}

.col{
    display:flex;
    align-items:center;
    gap:10px;
    color:white;
}

.col img{
    width:40px;
}

.error{
    color:red;
    text-align:center;
    margin-top:15px;
    display:none;
    font-weight:600;
}

.sunny{
    background:linear-gradient(135deg,#f6d365,#fda085);
}

.cloudy{
    background:linear-gradient(135deg,#bdc3c7,#2c3e50);
}

.rainy{
    background:linear-gradient(135deg,#4facfe,#00f2fe);
}

</style>
</head>

<body>

<div class="container">

    <div class="search-box">
        <input type="text" placeholder="Enter City Name" id="cityInput">
        <button onclick="getWeather()">🔍</button>
    </div>

    <div class="error" id="error">
        City Not Found
    </div>

    <div class="weather">

        <img src="https://cdn-icons-png.flaticon.com/512/869/869869.png" id="weatherIcon">

        <div class="temp" id="temp">28°C</div>

        <div class="city" id="city">Mumbai</div>

        <div class="details">

            <div class="col">
                <img src="https://cdn-icons-png.flaticon.com/512/1582/1582886.png">
                <div>
                    <h2 id="humidity">65%</h2>
                    <p>Humidity</p>
                </div>
            </div>

            <div class="col">
                <img src="https://cdn-icons-png.flaticon.com/512/959/959711.png">
                <div>
                    <h2 id="wind">18 km/h</h2>
                    <p>Wind Speed</p>
                </div>
            </div>

        </div>

    </div>

</div>

<script>

const apiKey = "YOUR_API_KEY";

async function getWeather(){

    const city = document.getElementById("cityInput").value;

    const apiURL =
    `https://api.openweathermap.org/data/2.5/weather?q=${city}&units=metric&appid=${apiKey}`;

    const response = await fetch(apiURL);

    if(response.status == 404){

        document.getElementById("error").style.display = "block";

    }else{

        document.getElementById("error").style.display = "none";

        const data = await response.json();

        document.getElementById("city").innerHTML = data.name;

        document.getElementById("temp").innerHTML =
        Math.round(data.main.temp) + "°C";

        document.getElementById("humidity").innerHTML =
        data.main.humidity + "%";

        document.getElementById("wind").innerHTML =
        data.wind.speed + " km/h";

        const weatherMain = data.weather[0].main;

        const icon = document.getElementById("weatherIcon");

        if(weatherMain == "Clouds"){

            icon.src =
            "https://cdn-icons-png.flaticon.com/512/414/414825.png";

            document.body.className = "cloudy";

        }

        else if(weatherMain == "Rain"){

            icon.src =
            "https://cdn-icons-png.flaticon.com/512/1163/1163624.png";

            document.body.className = "rainy";

        }

        else{

            icon.src =
            "https://cdn-icons-png.flaticon.com/512/869/869869.png";

            document.body.className = "sunny";

        }

    }

}

</script>

</body>
</html>
